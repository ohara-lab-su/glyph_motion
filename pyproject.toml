[build-system]
requires = ["setuptools>=71.0","coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-motion"
version = "0.3.9"

description = "Generate robot handwriting motion trajectories from text."
authors = [
    { name="Kengo NAKADA", email="kengo.nakada@email.com" },
]
readme = "README.md"
# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
    #"x_logger",
    "xlogger-py",
    # "packmol_util" ,
    #
    "dataclasses",
    "coloredlogs",
    "colorlog",
    "pytest",
    "pytest-asyncio",
    "pyyaml",
    "toml",
    # "grpcio",
    "nest_asyncio",
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py",
    #
    "scikit-image",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
[project.urls]
Homepage = "https://ohara-lab-su.github.io/glyph_motion/"
Documentation = "https://ohara-lab-su.github.io/glyph_motion/"
Repository = "https://github.com/ohara-lab-su/glyph_motion"
Issues = "https://github.com/ohara-lab-su/glyph_motion/issues"
