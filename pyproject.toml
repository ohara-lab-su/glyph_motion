[build-system]
requires = ["setuptools>=71.0","coloredlogs"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph_motion"
version = "0.2.1"

description = "Generate robot handwriting motions from text strings."
authors = [
    { name="Kengo NAKADA", email="kengo.nakada@email.com" },
]
readme = "README.md"
# requires-python = ">=3.8"
requires-python = ">=3.10"
dependencies = [
"x_logger",
# "packmol_util" ,
#
"dataclasses",
"coloredlogs",
"colorlog",
"pytest",
"pytest-asyncio",
"pyyaml",
"toml",
# "grpcio",
"nest_asyncio",
"sphinx",
"myst-parser",
"sphinx-autobuild",
"sphinx-rtd-theme",
"sphinxcontrib-napoleon",
"linkify-it-py",
    #
    "scikit-image",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 88

[tool.isort]
profile = "black"